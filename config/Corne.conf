## TEST
CONFIG_ZMK_SPLIT=y


## GENERAL
CONFIG_ZMK_KEYBOARD_NAME="CorneBTW2"

### batttery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=n
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

### bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y
#CONFIG_BT_DEVICE_APPEARANCE=961

### zmk
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_KEYMAP_LAYER_NAME_MAX_LEN=20
CONFIG_ZMK_STUDIO_LOCKING=y
# 10 min
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=600
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

### settings
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=600000

###
# OLED配置
CONFIG_ZMK_DISPLAY=y
#CONFIG_ZMK_WIDGET_BONGO_CAT=y
#CONFIG_ZMK_WIDGET_LUNA=y
#CONFIG_ZMK_WIDGET_WPM_STATUS=n
#CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
#CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
#CONFIG_ZMK_WIDGET_LAYER_STATUS=y
#CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
# label
#CONFIG_ZMK_WIDGET_LABEL=y
#CONFIG_ZMK_WIDGET_LABEL_TEXT="----  Corne_V3"

###
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60
