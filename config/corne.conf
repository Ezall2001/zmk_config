### system
#CONFIG_ZMK_BOARD_COMPAT=y NS
CONFIG_ZMK_KEYBOARD_NAME="CorneBTW"
#CONFIG_ZMK_WPM=y

## HID
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_HID_CONSUMER_REPORT_SIZE=6
CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=n
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=8
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

## usb
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y

## bluetooth
CONFIG_BT=y
CONFIG_BT_BAS=n
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=10
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_ZMK_BLE_THREAD_PRIORITY=5
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=5
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=20
#CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

## logging
CONFIG_ZMK_USB_LOGGING=n


### split
CONFIG_ZMK_SPLIT=y
#CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=n
CONFIG_ZMK_SPLIT_BLE=y
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=8
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=8
#CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=14


### batttery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60


### bluetooth
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n
#CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
#CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

#CONFIG_BT_DEVICE_APPEARANCE=961 NS


### zmk studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_KEYMAP_LAYER_NAME_MAX_LEN=20
CONFIG_ZMK_STUDIO_LOCKING=y
# 10 min
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=600
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y


### settings
CONFIG_ZMK_SETTINGS_RESET_ON_START=n
# 10 min
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=600000


### kscan
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=6

### layout
CONFIG_ZMK_PHYSICAL_LAYOUT_KEY_ROTATION=y

### combos
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=5

### behaviors
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=64
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=10
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=40
CONFIG_ZMK_BEHAVIOR_STICKY_KEY_MAX_HELD=10
CONFIG_ZMK_BEHAVIOR_TAP_DANCE_MAX_HELD=10
#-- macro


### power management
# 5min
#TODO add a 0
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
# 15 min 900000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=36000
CONFIG_ZMK_PM_SOFT_OFF=n
#CONFIG_ZMK_EXT_POWER=y


### underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=4
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_WS2812_STRIP=y

### display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=6
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_OLED_WIDGET_STATUS=y
CONFIG_NICE_OLED_WIDGET_INVERTED=n
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=n
